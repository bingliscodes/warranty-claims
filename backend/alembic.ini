# Alembic config. Run alembic commands from backend/ through uv, e.g.
#   uv run alembic upgrade head

[alembic]
# Where the migration scripts live, relative to this file.
script_location = %(here)s/alembic

# Put backend/ on sys.path so env.py can import the app package.
prepend_sys_path = .
path_separator = os

# Left empty on purpose: env.py falls back to Settings().DATABASE_URL.
# The tests set it to the test database instead.
sqlalchemy.url =


# Logging, used by env.py when alembic runs from the command line.
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
