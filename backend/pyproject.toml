[project]
name = "warranty-claims-backend"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0.36",
    "psycopg[binary]>=3.2",
    "alembic>=1.14",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "email-validator>=2.2",
    "boto3>=1.35",
    "httpx>=0.27",
    "tzdata>=2024.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "moto[s3]>=5.0",
    "ruff>=0.17.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The backend isn't installed as a package; tests import `app` from here.
pythonpath = ["."]

[tool.ruff]
line-length = 100

[tool.ruff.lint.flake8-bugbear]
# FastAPI's Depends() in a default argument is the intended pattern, not a bug.
extend-immutable-calls = ["fastapi.Depends"]

[tool.ruff.lint.flake8-comprehensions]
allow-dict-calls-with-keyword-arguments = true

[tool.ruff.lint.isort]
# The backend/alembic/ folder would otherwise make Ruff treat the alembic package as our code.
known-third-party = ["alembic"]
